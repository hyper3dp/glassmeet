<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f9f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1516" />
    <link rel="preconnect" href="https://sjxraemrdpzleipfmwun.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://sjxraemrdpzleipfmwun.supabase.co" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>html{background:#f6f9f9}html.site{background:#fff}@media (prefers-color-scheme: dark){html{background:#0f1516}html.site{background:#18191a}}</style>
    <meta name="description" content="Share one booking link. Guests pick a time without making an account, and you confirm the meeting in WhatsApp." />
    <title>GlassMeet — Schedule meetings. Stay on WhatsApp.</title>
    <meta property="og:site_name" content="GlassMeet" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GlassMeet — Schedule meetings. Stay on WhatsApp." />
    <meta property="og:description" content="Pick a time that suits you. Your meeting is confirmed on WhatsApp." />
    <meta property="og:image" content="https://glassmeet.run.place/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Runs before the app: put back the path public/404.html moved into ?__gh_pages_route=
      // (with its #access_token... hash) so Supabase sees sign-in links as they were sent.
      (function () {
        var route = new URLSearchParams(location.search).get('__gh_pages_route');
        if (route) {
          var restored = new URL(route, location.origin);
          var base = location.pathname.replace(/\/?$/, '/');
          history.replaceState(null, '', base + restored.pathname.replace(/^\/+/, '') + restored.search + restored.hash);
        }
        // Public pages paint their own colours from the first frame (same list as HOST_APP in APP.jsx)
        if (!/^\/(dashboard|calendar|event-types|bookings|availability|whatsapp|settings|calendar-connections|analytics)(\/|$)/.test(location.pathname)) {
          document.documentElement.classList.add('site');
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas[0].content = '#ffffff';
          metas[1].content = '#18191a';
        }
        // An expired or used auth link comes back as #error_description=...; show it on Log in.
        var hash = new URLSearchParams(location.hash.slice(1));
        var message = hash.get('error_description') || new URLSearchParams(location.search).get('error_description');
        if (message) {
          try { sessionStorage.setItem('gm-auth-error', message.replace(/\+/g, ' ')); } catch (e) {}
          // to the app's base path (Vite fills it in), whichever page the link landed on
          history.replaceState(null, '', '%BASE_URL%login');
        }
        // Clickjacking guard (GitHub Pages can't send X-Frame-Options or frame-ancestors): only
        // booking and confirmation pages opened by embed.js (?embed=1) may sit in another site's
        // frame. Anything else hides itself, so there is nothing to click, and tries to take over
        // the whole window (browsers may block that without a click; the page stays hidden).
        if (window.top !== window.self) {
          var embedded = /\/(book|confirm)\//.test(location.pathname) && (/[?&]embed=1(&|$)/.test(location.search)
            || (function () { try { return sessionStorage.getItem('gm-embed') === '1'; } catch (e) { return false; } })());
          if (!embedded) {
            document.documentElement.style.display = 'none';
            try { window.top.location.href = location.href; } catch (e) {}
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/Main.jsx"></script>
  </body>
</html>

    <script>
      const basePath = '/glassmeet/';
      const routePath = location.pathname.startsWith('/glassmeet')
        ? location.pathname.slice('/glassmeet'.length)
        : location.pathname;
      const route = `${routePath}${location.search}${location.hash}`;
      location.replace(`${basePath}?__gh_pages_route=${encodeURIComponent(route)}`);
    </script>

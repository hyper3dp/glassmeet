services:
  - type: web
    name: glassmeet
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/app/settings
    disk:
      name: glassmeet-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: APP_PUBLIC_URL
        value: https://glassmeet.com
      - key: GOOGLE_REDIRECT_URI
        value: https://glassmeet.com/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        generateValue: true